<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href="/src/style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Re-Conecta — Plataforma de gestión de talleres, actividades y participantes para organizaciones sociales." />
    <title>Re-Conecta</title>
    <!-- Anti-FOUC: aplicar tema antes de que Vue monte -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rc-theme');
          var dark = stored === 'dark' || (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('p-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
